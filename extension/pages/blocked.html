<!doctype html>
<meta charset="utf-8" />
<title>Guardrails</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-content: center; justify-items: start;
    gap: 0.75rem; padding: 2rem;
    font: 400 16px/1.55 ui-sans-serif, -apple-system, system-ui, sans-serif;
    background: Canvas; color: CanvasText;
  }
  h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
  p { margin: 0; max-width: 46ch; opacity: 0.7; }
  code { font: 400 0.875em ui-monospace, SFMono-Regular, monospace; opacity: 0.6; }
  .actions { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
  a.button {
    padding: 0.5rem 0.9rem; border-radius: 0.5rem; text-decoration: none;
    border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
    color: CanvasText; font-size: 0.9375rem;
  }
  a.button:hover { background: color-mix(in srgb, CanvasText 8%, transparent); }
</style>
